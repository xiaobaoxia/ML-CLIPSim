name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . -r requirements-research.txt pytest build
      - run: OMP_NUM_THREADS=2 python -m pytest -q
      - run: python -m build
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: cd /tmp && mlclipsim --help
