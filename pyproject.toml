[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlclipsim"
version = "0.1.0"
description = "Multi-Layer CLIP Similarity for machine-oriented image quality"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Feng Ding"}
]
keywords = ["image-quality", "metric", "loss", "CLIP", "image-compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "Pillow>=9",
  "numpy>=1.23,<3",
  "ftfy",
  "regex",
  "clip @ git+https://github.com/openai/CLIP.git@ded190a052fdf4585bd685cee5bc96e0310d2c93"
]

[project.scripts]
mlclipsim = "mlclipsim.cli:main"

[project.urls]
Repository = "https://github.com/xiaobaoxia/ML-CLIPSim"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlclipsim*"]

[tool.setuptools.package-data]
mlclipsim = ["weights/*.pt", "weights/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
